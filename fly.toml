# fly.toml app configuration file generated for luka-vapor on 2025-10-19T23:05:16Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# Topology: the `app` process serves HTTP only (its shard is nil, scheduler disabled);
# each `worker<i>` process polls shard i of SHARD_COUNT. Run exactly one machine per
# worker group and allocate a dedicated static egress IP to each:
#
#   fly scale count app=1 worker0=1 worker1=1 worker2=1 -a luka-vapor-v2 -y
#   fly machines egress-ip allocate <worker-machine-id> -a luka-vapor-v2   # per worker
#   fly machines egress-ip list -a luka-vapor-v2                           # verify
#
# Egress IPs persist across `fly deploy` but are RELEASED when a machine is destroyed —
# re-check `egress-ip list` after any scale-down/up or machine recreation.
#
# To change the shard count: add/remove worker groups here, update SHARD_COUNT to match,
# deploy, scale the new group to 1, allocate its egress IP. Removing both worker groups
# and SHARD_COUNT entirely restores legacy single-process mode (app runs the scheduler).

app = 'luka-vapor-v2'
primary_region = 'sjc'

[build]

[processes]
  app = 'serve --env production --hostname 0.0.0.0 --port 8080'
  worker0 = 'serve --env production --hostname 0.0.0.0 --port 8080'
  worker1 = 'serve --env production --hostname 0.0.0.0 --port 8080'
  worker2 = 'serve --env production --hostname 0.0.0.0 --port 8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1
  processes = ['app']

[env]
  LOG_LEVEL = 'info'
  SHARD_COUNT = '3'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
