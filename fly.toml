# fly.toml app configuration file generated for luka-vapor on 2025-10-19T23:05:16Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# Topology: the `app` process serves HTTP only (its shard is nil, scheduler disabled);
# each `worker<i>` process polls shard i of SHARD_COUNT from its own static egress IP.
# Egress IPs are app-scoped and regional (one pool per region, picked at random by the
# machines there), so each worker lives ALONE in its own region with exactly one egress
# IP pair allocated there: worker0=sjc (shared with `app`), worker1=lax, worker2=dfw,
# worker3=ord, worker4=iad, worker5=ewr. Regions are a machine property, not set here —
# a new worker group is created in primary_region and must be cloned into its own
# region. SHARD_COUNT must equal the number of worker groups, one machine per group.
# See docs/scaling.md for the full runbook.

app = 'luka-vapor-v2'
primary_region = 'sjc'

[build]

[processes]
  app = 'serve --env production --hostname 0.0.0.0 --port 8080'
  worker0 = 'serve --env production --hostname 0.0.0.0 --port 8080'
  worker1 = 'serve --env production --hostname 0.0.0.0 --port 8080'
  worker2 = 'serve --env production --hostname 0.0.0.0 --port 8080'
  worker3 = 'serve --env production --hostname 0.0.0.0 --port 8080'
  worker4 = 'serve --env production --hostname 0.0.0.0 --port 8080'
  worker5 = 'serve --env production --hostname 0.0.0.0 --port 8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1
  processes = ['app']

[env]
  LOG_LEVEL = 'info'
  SHARD_COUNT = '6'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
